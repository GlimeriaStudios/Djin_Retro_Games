<!doctype html><html lang="en"><meta charset="utf-8"><title>Driving audio diagnostic</title>
<body><h1>Driving audio diagnostic — synthetic test, not gameplay</h1>
<p>Renders the production V8 and tyre audio through Web Audio. Four seconds accelerating, two seconds drifting, two seconds muted.</p>
<button id="run">Render audio test</button><pre id="result"></pre><audio id="clip" controls></audio>
<script type="module">
import {DrivingAudio} from './driving-audio.js';
document.querySelector('#run').onclick=async()=>{
 const ctx=new OfflineAudioContext(1,48000*8,48000),drive=new DrivingAudio(ctx);
 const update=t=>drive.update({alive:true,vx:Math.min(28,t*7),vz:0,slip:t>=4?8:0,drifting:t>=4,surface:'asphalt'},{throttle:1},t<6,.1);
 update(0);
 const tasks=[];for(let step=1;step<80;step++){const when=step/10;tasks.push(ctx.suspend(when).then(()=>{update(when);return ctx.resume();}));}
 const out=await ctx.startRendering();await Promise.all(tasks);const data=out.getChannelData(0);
 const stats=(a,b)=>{const d=data.slice(a*48000,b*48000);return {rms:Math.sqrt(d.reduce((s,x)=>s+x*x,0)/d.length),peak:d.reduce((s,x)=>Math.max(s,Math.abs(x)),0)};};
 document.querySelector('#result').textContent=JSON.stringify({engine:stats(1,4),drift:stats(4.5,5.8),muted:stats(7.5,8)},null,2);
 const wav=new ArrayBuffer(44+data.length*2),v=new DataView(wav),str=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
 str(0,'RIFF');v.setUint32(4,wav.byteLength-8,true);str(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,48000,true);v.setUint32(28,96000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,data.length*2,true);
 data.forEach((x,i)=>v.setInt16(44+i*2,Math.max(-1,Math.min(1,x))*32767,true));
 document.querySelector('#clip').src=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));
};
</script></body></html>
