<!doctype html><html><head><title>High Dock verification</title><style>body{margin:0;background:#183e48;color:#fff;font:13px system-ui}canvas{position:fixed;inset:0}nav,#status{position:fixed;z-index:2;left:12px;background:#183e48d0;padding:10px}nav{top:10px}button{padding:10px;margin:4px}#status{bottom:12px}</style></head><body><canvas id="world"></canvas><nav><button data-s=".23">High dock</button><button data-s=".34">Banked descent</button><button data-s=".50">Chicane</button><button data-s=".68">Upper bend</button><button id="auto">Toggle auto drive</button></nav><div id="status"></div><script type="module">
import {View} from './game/render.js';import {makeGame,startRound,step} from './game/sim.js';import {alignSurface} from './game/terrain.js';let g,auto=true;const v=new View(document.querySelector('canvas'));function setup(f=.23){g=makeGame();startRound(g,true);g.phase='race';for(const c of g.cars){const s=g.track.length*f-c.id*9,p=g.track.at(s,0);Object.assign(c,{x:p.x,z:p.z,a:p.angle,vx:0,vz:0,progress:s,lastS:s,bot:true,shield:100});alignSurface(c,g.track);}v.build(g.track);v.cameraRound=-1;v.lastEvent=0;}setup();for(const b of document.querySelectorAll('[data-s]'))b.onclick=()=>setup(Number(b.dataset.s));document.querySelector('#auto').onclick=()=>auto=!auto;let last=performance.now();function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;if(auto)step(g,{},dt);if(g.phase==='match')setup();v.frame(g,dt,'race',0);const c=g.cars[0],p=g.track.nearest(c.x,c.z);document.querySelector('#status').textContent='Height '+c.y.toFixed(1)+'m · Width '+p.width.toFixed(1)+'m · Bank '+(p.bank*180/Math.PI).toFixed(1)+'° · '+Math.round(v.fps)+' FPS · '+g.phase;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
