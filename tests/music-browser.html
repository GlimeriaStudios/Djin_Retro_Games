<!doctype html><html><body style="background:#153846;color:#fff;font:18px sans-serif;padding:40px"><h1>Grayline soundtrack render</h1><p>162 seconds · C minor · 96 BPM · original synthesized arrangement</p><button id="render">Render WAV preview</button><p id="status">Ready</p><script type="module">
import {RaceMusic,scoreEvents} from './game/music.js';
document.querySelector('#render').onclick=async()=>{
const status=document.querySelector('#status');status.textContent='Rendering full build and two theme entries…';
try{const rate=22050,ctx=new OfflineAudioContext(1,rate*162,rate),music=new RaceMusic(ctx);clearInterval(music.timer);music.bus.gain.setValueAtTime(.48,0);for(let bar=0;bar<64;bar++)for(const e of scoreEvents(bar))music.play(e,e.time+.02);
const buffer=await ctx.startRendering(),samples=buffer.getChannelData(0),bytes=new ArrayBuffer(44+samples.length*2),v=new DataView(bytes),text=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};text(0,'RIFF');v.setUint32(4,36+samples.length*2,true);text(8,'WAVE');text(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);text(36,'data');v.setUint32(40,samples.length*2,true);let peak=0,energy=0;for(let i=0;i<samples.length;i++){const x=samples[i];peak=Math.max(peak,Math.abs(x));energy+=x*x;v.setInt16(44+i*2,Math.max(-1,Math.min(1,x))*32767,true);}
const url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'})),a=document.createElement('a');a.href=url;a.download='Grayline-Fifth-Funk.wav';a.textContent='Download original WAV';document.body.append(a);const audio=document.createElement('audio');audio.controls=true;audio.src=url;document.body.append(audio);status.textContent='Complete — 162 seconds · peak '+peak.toFixed(3)+' · RMS '+Math.sqrt(energy/samples.length).toFixed(3)+' · '+(peak<1?'no digital clipping':'clipping detected');}catch(e){status.textContent=e.message;}}
</script></body></html>
