<!doctype html><html><head><meta charset="utf-8"><title>Grayline combat art verification</title><style>body{margin:0;background:#143846;color:#fff;font:14px system-ui}canvas{position:fixed;inset:0}nav{position:fixed;top:10px;left:10px;z-index:2;display:flex;gap:8px}button{padding:12px;background:#153846;color:#ffe1a0;border:1px solid #ffe1a0}#status{position:fixed;bottom:20px;left:20px;z-index:2;background:#143846;padding:14px}</style></head><body><canvas id="world"></canvas><nav><button data-type="rocket">Comet rocket</button><button data-type="mine">Snapjaw mine</button><button data-type="oil">Inkspill oil</button><button data-type="boost">Afterburn boost</button><button id="fire">Fire / deploy</button><button id="reset">Reset scene</button></nav><div id="status"></div><script type="module">
import {View} from './game/render.js';import {makeGame,startRound,step,fireWeapon} from './game/sim.js';
const view=new View(document.querySelector('canvas'));let g;
function reset(){g=makeGame();startRound(g,true);g.phase='race';const p=g.track.at(25);for(const c of g.cars){c.bot=false;c.shield=0;c.x=p.x+Math.sin(p.angle)*c.id*10;c.z=p.z+Math.cos(p.angle)*c.id*10;c.a=p.angle;}g.cars[0].weapon='rocket';g.cars[0].ammo=9;view.build(g.track);view.lastEvent=0;}
reset();for(const b of document.querySelectorAll('[data-type]'))b.onclick=()=>{g.cars[0].weapon=b.dataset.type;g.cars[0].ammo=9;};document.querySelector('#fire').onclick=()=>fireWeapon(g,g.cars[0]);document.querySelector('#reset').onclick=reset;let last=performance.now();function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;step(g,{},dt);if(g.phase!=='race')reset();view.frame(g,dt,'race',0);document.querySelector('#status').textContent=g.cars[0].weapon+' · '+Math.round(view.fps)+' FPS · shots '+g.shots.length+' · hazards '+g.hazards.length;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
